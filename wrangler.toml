name = "gold-dashboard"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Environment Variables
[vars]
BRIDGE_TOKEN = "macroquant_secret_token_2026_xyz"

# Cloudflare KV Storage Binding
# Run: npx wrangler kv:namespace create "MACRO_KV" and paste the generated id below
[[kv_namespaces]]
binding = "MACRO_KV"
id = "macro_kv_live_storage_id"
preview_id = "macro_kv_preview_storage_id"

# Bundle raw HTML files directly into Worker
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
